name: deploy-env
# Reusable: terraform apply for one environment with a given image digest, then smoke check.
# The production GitHub environment has a required reviewer, so this job waits for a human there.
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      image: { type: string, required: true }
permissions:
  contents: read
  id-token: write
  # Read only, for the release report (merged pull requests and previous deployments).
  pull-requests: read
  deployments: read
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Record start time
        id: start
        working-directory: .
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8, terraform_wrapper: false }
      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Terraform plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_runtime_sa_email: ${{ vars.GCP_RUNTIME_SA }}
          TF_VAR_image: ${{ inputs.image }}
          TF_VAR_app_version: ${{ github.sha }}
        run: |
          terraform plan -input=false -var-file="envs/${{ inputs.environment }}.tfvars" -out=tfplan
          terraform show -no-color tfplan > plan.txt
          { echo '### Terraform plan: ${{ inputs.environment }}'; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Terraform apply
        run: terraform apply -input=false tfplan
      - name: Smoke check
        id: smoke
        run: |
          url="$(terraform output -raw api_url)"
          for i in $(seq 1 10); do
            body="$(curl -fsS "$url/healthz" || true)"
            if echo "$body" | grep -q "\"version\":\"${GITHUB_SHA}\""; then echo "ok: $body"; echo "Smoke ok: $url" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep 6
          done
          echo "Smoke check failed: $body"; exit 1

      # Tells SolutionIQ Studio what was deployed. Proves itself with this job's GitHub OIDC token
      # (Studio checks repository, environment, workflow and ref), so no shared secret is needed.
      # Never fails the deploy: a Studio outage must not block a release.
      # Release report: every change merged since this environment's last successful deploy, with each
      # pull request's delivery report and the user guide. Read only. Never fails the deploy.
      - name: Compose release report
        if: ${{ always() && vars.STUDIO_DEPLOY_REPORT_URL != '' }}
        continue-on-error: true
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          url="$(terraform -chdir=infra/terraform output -raw api_url 2>/dev/null || true)"
          case "$SMOKE" in success) smoke=passed;; failure) smoke=failed;; *) smoke=skipped;; esac
          node scripts/release-notes.mjs --environment "$ENVIRONMENT" --sha "$GITHUB_SHA" --url "$url" --smoke "$smoke" > "$RUNNER_TEMP/release.json"
          { echo "### Release report: $ENVIRONMENT"; jq -r '.notes_markdown' "$RUNNER_TEMP/release.json"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Report deployment to Studio
        if: ${{ always() && vars.STUDIO_DEPLOY_REPORT_URL != '' }}
        continue-on-error: true
        env:
          REPORT_URL: ${{ vars.STUDIO_DEPLOY_REPORT_URL }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ inputs.image }}
          STARTED_AT: ${{ steps.start.outputs.at }}
          JOB_STATUS: ${{ job.status }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          url="$(terraform output -raw api_url 2>/dev/null || true)"
          case "$SMOKE" in success) smoke=passed;; failure) smoke=failed;; *) smoke=skipped;; esac
          if [ "$JOB_STATUS" = "success" ]; then status=success; else status=failure; fi
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(jq -rn --arg u "$REPORT_URL" '$u|@uri')" | jq -r .value)"
          body="$(jq -n --arg env "$ENVIRONMENT" --arg sha "$GITHUB_SHA" --arg image "$IMAGE" --arg url "$url" \
            --arg status "$status" --arg smoke "$smoke" --argjson run "$GITHUB_RUN_ID" \
            --arg started "$STARTED_AT" --arg finished "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{v:1, environment:$env, sha:$sha, image:$image, url:(if $url=="" then null else $url end),
              status:$status, smoke:$smoke, run_id:$run, started_at:$started, finished_at:$finished}')"
          if [ -s "$RUNNER_TEMP/release.json" ] && jq -e . "$RUNNER_TEMP/release.json" >/dev/null 2>&1; then
            body="$(jq --slurpfile rel "$RUNNER_TEMP/release.json" '. + {release: $rel[0]}' <<<"$body")"
          fi
          curl -fsS --max-time 15 -X POST "$REPORT_URL" -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" -d "$body" && echo "Reported to Studio: $status, smoke $smoke"
